# CI/CD: тесты на каждый push и pull request, автодеплой на сервер после push в main.
#
# Нужные секреты (Settings -> Secrets and variables -> Actions -> New repository secret):
#   SSH_HOST         публичный IP сервера в Oracle Cloud
#   SSH_PRIVATE_KEY  приватный ключ, которым можно зайти на сервер (весь файл целиком)
#   SSH_USER         необязательно, по умолчанию ubuntu
#   SSH_PORT         необязательно, по умолчанию 22
#   SSH_KNOWN_HOSTS  необязательно, но лучше задать: вывод `ssh-keyscan -t ed25519 <IP>`
#
# Файл .env в репозиторий не попадает: на сервере используется тот, что уже лежит в ~/footbalBot/.env.
name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest

  deploy:
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SSH_HOST: ${{ secrets.SSH_HOST }}
      SSH_USER: ${{ secrets.SSH_USER || 'ubuntu' }}
      SSH_PORT: ${{ secrets.SSH_PORT || '22' }}
    steps:
      - uses: actions/checkout@v4

      - name: Настроить SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          [ -n "$SSH_HOST" ] || { echo "::error::Не задан секрет SSH_HOST"; exit 1; }
          [ -n "$SSH_PRIVATE_KEY" ] || { echo "::error::Не задан секрет SSH_PRIVATE_KEY"; exit 1; }
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          if [ -n "$SSH_KNOWN_HOSTS" ]; then
            printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          else
            echo "::warning::SSH_KNOWN_HOSTS не задан — ключ сервера берётся через ssh-keyscan"
            ssh-keyscan -p "$SSH_PORT" -H "$SSH_HOST" > ~/.ssh/known_hosts
          fi
          cat > ~/.ssh/config <<EOF
          Host server
            HostName $SSH_HOST
            User $SSH_USER
            Port $SSH_PORT
            IdentityFile ~/.ssh/deploy_key
            IdentitiesOnly yes
            ConnectTimeout 20
            ServerAliveInterval 15
          EOF

      - name: Упаковать бота
        run: |
          tar -czf /tmp/footbalbot-deploy.tgz \
            --exclude=__pycache__ --exclude='*.pyc' \
            bot deploy/setup.sh main.py requirements.txt

      - name: Загрузить и установить на сервере
        run: |
          scp -q /tmp/footbalbot-deploy.tgz server:/tmp/footbalbot-deploy.tgz
          ssh server 'd=/tmp/footbalbot-deploy; rm -rf $d && mkdir -p $d && tar -xzf $d.tgz -C $d && bash $d/deploy/setup.sh $d; rc=$?; rm -rf $d $d.tgz; exit $rc'

      - name: Убрать ключ
        if: always()
        run: rm -f ~/.ssh/deploy_key
